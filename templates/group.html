{% extends "base.html" %}
{% from "_macros.html" import card %}
{% block page_kind %}group{% endblock %}
{% block main %}
<header class="listing-header">
  <span class="listing-header__kicker">Concept group</span>
  <h1>{{ group.title }}</h1>
  <p>{{ group.blurb }}</p>
</header>
<div class="grid">
  {% for p in cards(group.concepts) %}{{ card(p, root) }}{% endfor %}
</div>
{% endblock %}
