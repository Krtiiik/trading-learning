<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Site icon: a graduation cap with a bold rising trend line in front.
       The mask cuts a gap round the line so it reads on any tab background. -->
  <style>
    .cap   { fill: #1d2024; }
    .trend { stroke: #2e8a4e; fill: #2e8a4e; }
    @media (prefers-color-scheme: dark) {
      .cap   { fill: #e6e8eb; }
      .trend { stroke: #5cc27c; fill: #5cc27c; }
    }
  </style>
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <polyline points="2.5,28.5 10.5,22 16.5,26 26,17.5" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30 13 L30.6 21.6 L22 16.6 Z" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g class="cap" mask="url(#gap)">
    <path d="M16 2 L31 8.5 L16 15 L1 8.5 Z"/>
    <path d="M7 11.5 L16 15.5 L25 11.5 V18.5 C25 21 21 22.5 16 22.5 C11 22.5 7 21 7 18.5 Z"/>
    <rect x="2.6" y="9" width="1.6" height="9" rx="0.8"/>
  </g>
  <g class="trend">
    <polyline points="2.5,28.5 10.5,22 16.5,26 26,17.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 13 L29.4 20.6 L22.8 16.9 Z" stroke-width="1" stroke-linejoin="round"/>
  </g>
</svg>
