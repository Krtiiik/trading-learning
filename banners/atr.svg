<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A row of up and down candles, each with a bracket that marks its true range from high to low, and on a gap day from the previous close; below them, an ATR line rises as the ranges get bigger, whatever the direction">
  <rect width="1200" height="400" style="fill: var(--banner-bg, #f2f4f7)"/>
  <!-- the gap on day four: from the previous close down to the next high -->
  <rect x="370" y="135" width="132" height="30" style="fill: var(--banner-accent, #0b6bcb); fill-opacity: .15"/>
  <line x1="370" y1="135" x2="502" y2="135" stroke-width="3" stroke-dasharray="8 8" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .6"/>
  <!-- wicks -->
  <g stroke-width="3" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .35">
    <line x1="110" y1="120" x2="110" y2="175"/><line x1="230" y1="115" x2="230" y2="170"/>
    <line x1="350" y1="125" x2="350" y2="175"/><line x1="470" y1="165" x2="470" y2="215"/>
    <line x1="590" y1="80" x2="590" y2="210"/><line x1="710" y1="60" x2="710" y2="190"/>
    <line x1="830" y1="50" x2="830" y2="200"/>
  </g>
  <!-- candles: up and down mixed -->
  <g style="fill: var(--banner-up, #1a9b5b); fill-opacity: .7">
    <rect x="90" y="132" width="40" height="33"/><rect x="330" y="135" width="40" height="30"/>
    <rect x="570" y="95" width="40" height="105"/><rect x="810" y="65" width="40" height="120"/>
  </g>
  <g style="fill: var(--banner-down, #d0453a); fill-opacity: .7">
    <rect x="210" y="130" width="40" height="30"/><rect x="450" y="170" width="40" height="35"/>
    <rect x="690" y="75" width="40" height="100"/>
  </g>
  <!-- true range of each day -->
  <path d="M142 120 L142 175 M134 120 L150 120 M134 175 L150 175
           M262 115 L262 170 M254 115 L270 115 M254 170 L270 170
           M382 125 L382 175 M374 125 L390 125 M374 175 L390 175
           M502 135 L502 215 M494 135 L510 135 M494 215 L510 215
           M622 80 L622 210 M614 80 L630 80 M614 210 L630 210
           M742 60 L742 190 M734 60 L750 60 M734 190 L750 190
           M862 50 L862 200 M854 50 L870 50 M854 200 L870 200"
        fill="none" stroke-width="4" stroke-linecap="round" style="stroke: var(--banner-fg, #1a1a1a)"/>
  <!-- indicator panel -->
  <line x1="40" y1="245" x2="1160" y2="245" stroke-width="2" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .25"/>
  <line x1="40" y1="365" x2="890" y2="365" stroke-width="2" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .25"/>
  <!-- size of each true range, all measured upward -->
  <g style="fill: var(--banner-fg, #1a1a1a); fill-opacity: .15">
    <rect x="128" y="332" width="28" height="33"/><rect x="248" y="332" width="28" height="33"/>
    <rect x="368" y="335" width="28" height="30"/><rect x="488" y="317" width="28" height="48"/>
    <rect x="608" y="287" width="28" height="78"/><rect x="728" y="287" width="28" height="78"/>
    <rect x="848" y="275" width="28" height="90"/>
  </g>
  <!-- ATR: the average size -->
  <path d="M142 332 C200 332 320 334 382 333 C440 332 460 330 502 326 C560 320 580 316 622 312 C680 306 700 304 742 300 C800 295 830 293 862 290"
        fill="none" stroke-width="7" stroke-linecap="round" style="stroke: var(--banner-accent, #0b6bcb)"/>
  <g font-family="system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="2">
    <text x="910" y="134" style="fill: var(--banner-fg, #1a1a1a)">TRUE RANGE</text>
    <text x="910" y="300" style="fill: var(--banner-accent, #0b6bcb)">ATR</text>
    <text x="910" y="338" style="fill: var(--banner-fg, #1a1a1a); fill-opacity: .6">SIZE, NOT</text>
    <text x="910" y="370" style="fill: var(--banner-fg, #1a1a1a); fill-opacity: .6">DIRECTION</text>
  </g>
</svg>
