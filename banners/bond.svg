<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A bond timeline: you lend 1,000 at the start, receive small equal coupon payments along the way, and get the 1,000 back at maturity">
  <rect width="1200" height="400" style="fill: var(--banner-bg, #f2f4f7)"/>
  <!-- the life of the bond: a time axis from start to maturity -->
  <path d="M50 200 L1160 200 M1140 180 L1160 200 L1140 220" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
        style="stroke: var(--banner-accent, #0b6bcb)"/>
  <!-- start: you pay the money out (below the line) -->
  <rect x="70" y="200" width="80" height="120" stroke-width="5"
        style="fill: var(--banner-down, #d0453a); fill-opacity: .2; stroke: var(--banner-down, #d0453a)"/>
  <!-- coupons: small equal payments in (above the line) -->
  <g stroke-width="4" style="fill: var(--banner-up, #1a9b5b); fill-opacity: .2; stroke: var(--banner-up, #1a9b5b)">
    <rect x="228" y="160" width="44" height="40"/><rect x="318" y="160" width="44" height="40"/><rect x="408" y="160" width="44" height="40"/>
    <rect x="498" y="160" width="44" height="40"/><rect x="588" y="160" width="44" height="40"/><rect x="678" y="160" width="44" height="40"/>
    <rect x="768" y="160" width="44" height="40"/><rect x="858" y="160" width="44" height="40"/><rect x="948" y="160" width="44" height="40"/>
  </g>
  <!-- maturity: the full amount comes back -->
  <rect x="1040" y="80" width="80" height="120" stroke-width="5"
        style="fill: var(--banner-up, #1a9b5b); fill-opacity: .2; stroke: var(--banner-up, #1a9b5b)"/>
  <g font-family="system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="3">
    <text x="60" y="368" style="fill: var(--banner-down, #d0453a)">LEND $1,000</text>
    <text x="610" y="130" text-anchor="middle" style="fill: var(--banner-up, #1a9b5b)">COUPONS</text>
    <text x="1140" y="368" text-anchor="end" style="fill: var(--banner-up, #1a9b5b)">$1,000 BACK</text>
    <text x="610" y="270" text-anchor="middle" style="fill: var(--banner-fg, #1a1a1a)">TIME</text>
  </g>
</svg>
