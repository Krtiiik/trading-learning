<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Three candlestick patterns side by side, each at the end of a short falling run: a doji, a hammer and a bullish engulfing pattern">
  <rect width="1200" height="400" style="fill: var(--banner-bg, #f2f4f7)"/>
  <!-- DOJI: open and close almost equal -->
  <g transform="translate(15 0)">
    <rect x="235" y="160" width="80" height="155" rx="10" stroke-width="3"
          style="fill: var(--banner-accent, #0b6bcb); fill-opacity: .15; stroke: var(--banner-accent, #0b6bcb)"/>
    <g stroke-width="3" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .35">
      <line x1="70" y1="50" x2="70" y2="130"/><line x1="125" y1="95" x2="125" y2="175"/>
      <line x1="180" y1="140" x2="180" y2="220"/>
    </g>
    <g style="fill: var(--banner-down, #d0453a); fill-opacity: .55">
      <rect x="54" y="60" width="32" height="50"/><rect x="109" y="105" width="32" height="50"/>
      <rect x="164" y="150" width="32" height="50"/>
    </g>
    <line x1="275" y1="175" x2="275" y2="300" stroke-width="4" style="stroke: var(--banner-fg, #1a1a1a)"/>
    <rect x="253" y="234" width="44" height="7" style="fill: var(--banner-fg, #1a1a1a)"/>
  </g>
  <!-- HAMMER: small body on top, long lower wick -->
  <g transform="translate(405 0)">
    <rect x="235" y="175" width="80" height="150" rx="10" stroke-width="3"
          style="fill: var(--banner-accent, #0b6bcb); fill-opacity: .15; stroke: var(--banner-accent, #0b6bcb)"/>
    <g stroke-width="3" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .35">
      <line x1="70" y1="50" x2="70" y2="130"/><line x1="125" y1="95" x2="125" y2="175"/>
      <line x1="180" y1="140" x2="180" y2="220"/>
    </g>
    <g style="fill: var(--banner-down, #d0453a); fill-opacity: .55">
      <rect x="54" y="60" width="32" height="50"/><rect x="109" y="105" width="32" height="50"/>
      <rect x="164" y="150" width="32" height="50"/>
    </g>
    <line x1="275" y1="188" x2="275" y2="312" stroke-width="4" style="stroke: var(--banner-fg, #1a1a1a)"/>
    <rect x="253" y="195" width="44" height="28" style="fill: var(--banner-up, #1a9b5b)"/>
  </g>
  <!-- BULLISH ENGULFING: a large up body covers the small down body before it -->
  <g transform="translate(795 0)">
    <rect x="205" y="165" width="115" height="110" rx="10" stroke-width="3"
          style="fill: var(--banner-accent, #0b6bcb); fill-opacity: .15; stroke: var(--banner-accent, #0b6bcb)"/>
    <g stroke-width="3" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .35">
      <line x1="60" y1="50" x2="60" y2="130"/><line x1="110" y1="95" x2="110" y2="175"/>
      <line x1="160" y1="140" x2="160" y2="220"/>
    </g>
    <g style="fill: var(--banner-down, #d0453a); fill-opacity: .55">
      <rect x="45" y="60" width="30" height="50"/><rect x="95" y="105" width="30" height="50"/>
      <rect x="145" y="150" width="30" height="50"/>
    </g>
    <g stroke-width="4" style="stroke: var(--banner-fg, #1a1a1a)">
      <line x1="235" y1="198" x2="235" y2="245"/><line x1="285" y1="180" x2="285" y2="262"/>
    </g>
    <rect x="221" y="207" width="28" height="28" style="fill: var(--banner-down, #d0453a)"/>
    <rect x="265" y="190" width="40" height="64" style="fill: var(--banner-up, #1a9b5b)"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="3" text-anchor="middle"
     style="fill: var(--banner-fg, #1a1a1a)">
    <text x="290" y="370">DOJI</text>
    <text x="680" y="370">HAMMER</text>
    <text x="1057" y="370">ENGULFING</text>
  </g>
</svg>
