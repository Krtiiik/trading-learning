<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A contract card between a buyer and a seller fixes the price at 100 today; that price runs as a dashed line along a timeline to the expiry date on a calendar, while the market price moves up and down on the way">
  <rect width="1200" height="400" style="fill: var(--banner-bg, #f2f4f7)"/>
  <!-- the contract: one price agreed today by a buyer and a seller -->
  <rect x="40" y="40" width="330" height="290" rx="18" stroke-width="6"
        style="fill: var(--banner-accent, #0b6bcb); fill-opacity: .1; stroke: var(--banner-accent, #0b6bcb)"/>
  <text x="205" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700"
        letter-spacing="3" style="fill: var(--banner-accent, #0b6bcb)">CONTRACT</text>
  <text x="205" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="80" font-weight="700"
        letter-spacing="3" style="fill: var(--banner-accent, #0b6bcb)">100</text>
  <rect x="64" y="232" width="134" height="68" rx="12" stroke-width="5"
        style="fill: var(--banner-up, #1a9b5b); fill-opacity: .15; stroke: var(--banner-up, #1a9b5b)"/>
  <rect x="212" y="232" width="134" height="68" rx="12" stroke-width="5"
        style="fill: var(--banner-down, #d0453a); fill-opacity: .15; stroke: var(--banner-down, #d0453a)"/>
  <g font-family="system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="131" y="275" style="fill: var(--banner-up, #1a9b5b)">BUYER</text>
    <text x="279" y="275" style="fill: var(--banner-down, #d0453a)">SELLER</text>
  </g>
  <text x="205" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700"
        letter-spacing="3" style="fill: var(--banner-fg, #1a1a1a)">FIXED PRICE</text>
  <!-- today and the future date -->
  <g fill="none" stroke-width="3" stroke-dasharray="8 10" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .35">
    <path d="M440 60 L440 300"/>
    <path d="M1080 60 L1080 270"/>
  </g>
  <!-- the agreed price holds until the date -->
  <path d="M370 150 L1080 150" fill="none" stroke-width="6" stroke-dasharray="20 12"
        style="stroke: var(--banner-accent, #0b6bcb)"/>
  <!-- the market price moves on the way -->
  <path d="M440 150 L520 178 L600 128 L680 192 L760 160 L840 214 L920 172 L1000 122 L1080 96" fill="none"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
        style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .7"/>
  <circle cx="1080" cy="96" r="9" style="fill: var(--banner-fg, #1a1a1a)"/>
  <text x="1056" y="72" text-anchor="end" font-family="system-ui, sans-serif" font-size="26" font-weight="700"
        letter-spacing="2" style="fill: var(--banner-fg, #1a1a1a); fill-opacity: .8">MARKET</text>
  <!-- the timeline -->
  <path d="M430 300 L1150 300 M1130 288 L1150 300 L1130 312 M440 288 L440 312" fill="none" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--banner-fg, #1a1a1a)"/>
  <!-- calendar on the date -->
  <rect x="1052" y="274" width="56" height="52" rx="6" stroke-width="4"
        style="fill: var(--banner-bg, #f2f4f7); stroke: var(--banner-accent, #0b6bcb)"/>
  <rect x="1052" y="274" width="56" height="16" rx="4" style="fill: var(--banner-accent, #0b6bcb)"/>
  <path d="M1067 266 L1067 282 M1093 266 L1093 282" stroke-width="5" stroke-linecap="round"
        style="stroke: var(--banner-accent, #0b6bcb)"/>
  <g font-family="system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="3" text-anchor="middle">
    <text x="440" y="372" style="fill: var(--banner-fg, #1a1a1a)">TODAY</text>
    <text x="1080" y="372" style="fill: var(--banner-accent, #0b6bcb)">EXPIRY</text>
  </g>
</svg>
