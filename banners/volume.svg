<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A row of small candles with a row of volume bars under them; on one news day a big rising candle sits over a volume bar several times taller than the others">
  <rect width="1200" height="400" style="fill: var(--banner-bg, #f2f4f7)"/>
  <!-- candles, kept quiet -->
  <g stroke-width="3" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .35">
    <line x1="300" y1="128" x2="300" y2="158"/><line x1="362" y1="130" x2="362" y2="156"/><line x1="424" y1="126" x2="424" y2="152"/><line x1="486" y1="128" x2="486" y2="150"/><line x1="548" y1="122" x2="548" y2="146"/><line x1="610" y1="124" x2="610" y2="144"/><line x1="672" y1="130" x2="672" y2="152"/><line x1="734" y1="128" x2="734" y2="150"/><line x1="796" y1="130" x2="796" y2="148"/><line x1="858" y1="58" x2="858" y2="146"/><line x1="920" y1="56" x2="920" y2="86"/><line x1="982" y1="60" x2="982" y2="82"/><line x1="1044" y1="58" x2="1044" y2="80"/><line x1="1106" y1="60" x2="1106" y2="78"/>
  </g>
  <g style="fill: var(--banner-up, #1a9b5b); fill-opacity: .45"><rect x="283" y="135" width="34" height="15"/><rect x="407" y="132" width="34" height="14"/><rect x="531" y="128" width="34" height="12"/><rect x="717" y="134" width="34" height="10"/><rect x="841" y="70" width="34" height="70"/><rect x="903" y="64" width="34" height="10"/><rect x="1027" y="64" width="34" height="10"/></g>
  <g style="fill: var(--banner-down, #d0453a); fill-opacity: .45"><rect x="345" y="138" width="34" height="10"/><rect x="469" y="134" width="34" height="8"/><rect x="593" y="130" width="34" height="8"/><rect x="655" y="136" width="34" height="10"/><rect x="779" y="136" width="34" height="4"/><rect x="965" y="66" width="34" height="10"/><rect x="1089" y="66" width="34" height="4"/></g>
  <!-- divider between price and volume -->
  <line x1="40" y1="174" x2="1160" y2="174" stroke-width="2" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .2"/>
  <!-- volume bars, the focus -->
  <g style="fill: var(--banner-up, #1a9b5b)"><rect x="279" y="322" width="42" height="48"/><rect x="403" y="315" width="42" height="55"/><rect x="527" y="320" width="42" height="50"/><rect x="713" y="332" width="42" height="38"/><rect x="837" y="190" width="42" height="180"/><rect x="899" y="275" width="42" height="95"/><rect x="1023" y="320" width="42" height="50"/></g>
  <g style="fill: var(--banner-down, #d0453a)"><rect x="341" y="330" width="42" height="40"/><rect x="465" y="334" width="42" height="36"/><rect x="589" y="328" width="42" height="42"/><rect x="651" y="324" width="42" height="46"/><rect x="775" y="336" width="42" height="34"/><rect x="961" y="308" width="42" height="62"/><rect x="1085" y="326" width="42" height="44"/></g>
  <line x1="270" y1="370" x2="1160" y2="370" stroke-width="4" style="stroke: var(--banner-fg, #1a1a1a)"/>
  <!-- the news day -->
  <rect x="822" y="40" width="72" height="336" rx="10" fill="none" stroke-width="4" stroke-dasharray="10 8" style="stroke: var(--banner-accent, #0b6bcb)"/>
  <g font-family="system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="3" style="fill: var(--banner-fg, #1a1a1a)">
    <text x="40" y="120" style="fill-opacity: .55">PRICE</text>
    <text x="40" y="320">VOLUME</text>
  </g>
  <text x="908" y="250" font-family="system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="2" style="fill: var(--banner-accent, #0b6bcb)">NEWS DAY</text>
</svg>
