<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="The same price history at two timeframes: twelve one-hour candles on top and the three four-hour candles they make below, each four-hour candle covering four of the hourly ones">
  <rect width="1200" height="400" style="fill: var(--banner-bg, #f2f4f7)"/>
  <!-- each 4h period, shaded across both rows -->
  <rect x="170" y="30" width="333" height="340" style="fill: var(--banner-accent, #0b6bcb); fill-opacity: .08"/>
  <rect x="837" y="30" width="333" height="340" style="fill: var(--banner-accent, #0b6bcb); fill-opacity: .08"/>
  <g stroke-width="2" stroke-dasharray="6 6" style="stroke: var(--banner-accent, #0b6bcb); stroke-opacity: .5">
    <line x1="170" y1="30" x2="170" y2="370"/><line x1="503" y1="30" x2="503" y2="370"/><line x1="837" y1="30" x2="837" y2="370"/><line x1="1170" y1="30" x2="1170" y2="370"/>
  </g>
  <!-- twelve 1h candles -->
  <g stroke-width="3" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: 0.5">
    <line x1="212" y1="115" x2="212" y2="160"/><line x1="295" y1="95" x2="295" y2="135"/><line x1="378" y1="100" x2="378" y2="140"/><line x1="462" y1="75" x2="462" y2="135"/><line x1="545" y1="65" x2="545" y2="110"/><line x1="628" y1="90" x2="628" y2="145"/><line x1="712" y1="120" x2="712" y2="165"/><line x1="795" y1="130" x2="795" y2="175"/><line x1="878" y1="105" x2="878" y2="150"/><line x1="962" y1="80" x2="962" y2="120"/><line x1="1045" y1="85" x2="1045" y2="115"/><line x1="1128" y1="45" x2="1128" y2="110"/>
  </g>
  <g style="fill: var(--banner-up, #1a9b5b)" fill-opacity="0.70">
    <rect x="195" y="125" width="34" height="20"/><rect x="278" y="105" width="34" height="20"/><rect x="445" y="85" width="34" height="45"/><rect x="778" y="140" width="34" height="15"/><rect x="861" y="110" width="34" height="30"/><rect x="945" y="90" width="34" height="20"/><rect x="1111" y="55" width="34" height="50"/>
  </g>
  <g style="fill: var(--banner-down, #d0453a)" fill-opacity="0.70">
    <rect x="361" y="105" width="34" height="25"/><rect x="528" y="85" width="34" height="15"/><rect x="611" y="100" width="34" height="35"/><rect x="695" y="135" width="34" height="20"/><rect x="1028" y="90" width="34" height="15"/>
  </g>
  <!-- the three 4h candles they make -->
  <g stroke-width="6" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: 1">
    <line x1="337" y1="248" x2="337" y2="343"/><line x1="670" y1="237" x2="670" y2="360"/><line x1="1003" y1="215" x2="1003" y2="332"/>
  </g>
  <g style="fill: var(--banner-up, #1a9b5b)">
    <rect x="262" y="260" width="150" height="67"/><rect x="928" y="226" width="150" height="95"/>
  </g>
  <g style="fill: var(--banner-down, #d0453a)">
    <rect x="595" y="260" width="150" height="61"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="3" style="fill: var(--banner-accent, #0b6bcb)">
    <text x="40" y="122">1H</text><text x="40" y="300">4H</text>
  </g>
</svg>
