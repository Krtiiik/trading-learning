<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="One trade on a price chart: bought at an entry of $42 with a stop at $38 and a target at $54, then sold at an exit of $64; beside it the plan steps numbered 2 to 5: stop $38, size 25 shares, target $54, costs">
  <rect width="1200" height="400" style="fill: var(--banner-bg, #f2f4f7)"/>
  <!-- price scale: y = 350 - (price - 36) x 9 -->
  <!-- risk (entry to stop) and reward (entry to target) zones from the entry on -->
  <rect x="320" y="296" width="430" height="36" style="fill: var(--banner-down, #d0453a); fill-opacity: .12"/>
  <rect x="320" y="188" width="430" height="108" style="fill: var(--banner-up, #1a9b5b); fill-opacity: .12"/>
  <!-- the four levels -->
  <line x1="240" y1="98" x2="760" y2="98" stroke-width="3" stroke-dasharray="10 8" style="stroke: var(--banner-accent, #0b6bcb); stroke-opacity: .6"/>
  <line x1="240" y1="188" x2="760" y2="188" stroke-width="5" style="stroke: var(--banner-up, #1a9b5b)"/>
  <line x1="240" y1="296" x2="760" y2="296" stroke-width="3" stroke-dasharray="10 8" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .6"/>
  <line x1="240" y1="332" x2="760" y2="332" stroke-width="5" style="stroke: var(--banner-down, #d0453a)"/>
  <!-- price rising into the entry -->
  <path d="M245 324 L272 310 L296 316 L320 296" fill="none" stroke-width="6" stroke-linejoin="miter" style="stroke: var(--banner-fg, #1a1a1a)"/>
  <!-- the trade: from the entry at $42 past the target to the exit at $64 -->
  <path d="M320 296 L380 251 L420 269 L480 215 L520 233 L580 179 L620 197 L680 134 L710 152 L750 98"
        fill="none" stroke-width="6" stroke-linejoin="miter" style="stroke: var(--banner-accent, #0b6bcb)"/>
  <circle cx="320" cy="296" r="12" style="fill: var(--banner-accent, #0b6bcb)"/>
  <circle cx="750" cy="98" r="12" style="fill: var(--banner-accent, #0b6bcb)"/>
  <!-- level labels -->
  <g font-family="system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="1" text-anchor="end">
    <text x="222" y="107" style="fill: var(--banner-accent, #0b6bcb)">EXIT $64</text>
    <text x="222" y="197" style="fill: var(--banner-up, #1a9b5b)">TARGET $54</text>
    <text x="222" y="305" style="fill: var(--banner-fg, #1a1a1a); fill-opacity: .7">ENTRY $42</text>
    <text x="222" y="341" style="fill: var(--banner-down, #d0453a)">STOP $38</text>
  </g>
  <!-- the plan: steps 2 to 5 of the lesson (step 1 is the rule) -->
  <g font-family="system-ui, sans-serif" font-size="28" font-weight="800">
    <rect x="810" y="54" width="48" height="48" style="fill: var(--banner-fg, #1a1a1a)"/>
    <rect x="810" y="134" width="48" height="48" style="fill: var(--banner-fg, #1a1a1a)"/>
    <rect x="810" y="214" width="48" height="48" style="fill: var(--banner-fg, #1a1a1a)"/>
    <rect x="810" y="294" width="48" height="48" style="fill: var(--banner-fg, #1a1a1a)"/>
    <text x="834" y="88" text-anchor="middle" style="fill: var(--banner-bg, #f2f4f7)">2</text>
    <text x="834" y="168" text-anchor="middle" style="fill: var(--banner-bg, #f2f4f7)">3</text>
    <text x="834" y="248" text-anchor="middle" style="fill: var(--banner-bg, #f2f4f7)">4</text>
    <text x="834" y="328" text-anchor="middle" style="fill: var(--banner-bg, #f2f4f7)">5</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="1">
    <text x="874" y="87" style="fill: var(--banner-down, #d0453a)">STOP $38</text>
    <text x="874" y="167" style="fill: var(--banner-fg, #1a1a1a)">SIZE 25 SHARES</text>
    <text x="874" y="247" style="fill: var(--banner-up, #1a9b5b)">TARGET $54</text>
    <text x="874" y="327" style="fill: var(--banner-fg, #1a1a1a)">COSTS</text>
  </g>
</svg>
