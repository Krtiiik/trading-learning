<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Three small charts multiplied together: a US fund rises 10% in dollars, times the dollar falling 10% against the reader's koruna or euros, equals an almost flat line, about 0%, in the reader's own money">
  <rect width="1200" height="400" style="fill: var(--banner-bg, #f2f4f7)"/>
  <!-- each chart starts on a dashed level at y = 190; 6 px per 1% -->
  <g stroke-width="3" stroke-dasharray="10 8" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .6">
    <line x1="70" y1="190" x2="330" y2="190"/>
    <line x1="470" y1="190" x2="730" y2="190"/>
    <line x1="870" y1="190" x2="1130" y2="190"/>
  </g>
  <!-- the US fund in dollars: up 10% -->
  <path d="M70 190 L110 178 L150 186 L190 160 L230 168 L270 140 L300 148 L330 130" fill="none" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--banner-up, #1a9b5b)"/>
  <circle cx="330" cy="130" r="10" style="fill: var(--banner-up, #1a9b5b)"/>
  <!-- the dollar against CZK or EUR: down 10% -->
  <path d="M470 190 L510 200 L550 194 L590 222 L630 214 L670 240 L700 234 L730 250" fill="none" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--banner-down, #d0453a)"/>
  <circle cx="730" cy="250" r="10" style="fill: var(--banner-down, #d0453a)"/>
  <!-- the result in the reader's own money: flat -->
  <path d="M870 190 L910 184 L950 192 L990 186 L1030 194 L1070 188 L1100 192 L1130 190" fill="none" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--banner-accent, #0b6bcb)"/>
  <circle cx="870" cy="190" r="10" style="fill: var(--banner-fg, #1a1a1a)"/>
  <circle cx="1130" cy="190" r="10" style="fill: var(--banner-accent, #0b6bcb)"/>
  <!-- times and equals between the charts: the two returns multiply -->
  <g fill="none" stroke-width="7" stroke-linecap="round" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .55">
    <path d="M384 174 L416 206 M416 174 L384 206"/>
    <path d="M778 178 L822 178 M778 202 L822 202"/>
  </g>
  <!-- the change of each chart -->
  <g font-family="system-ui, sans-serif" font-size="40" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="200" y="85" style="fill: var(--banner-up, #1a9b5b)">+10%</text>
    <text x="600" y="85" style="fill: var(--banner-down, #d0453a)">−10%</text>
    <text x="1000" y="85" style="fill: var(--banner-accent, #0b6bcb)">≈ −1%</text>
  </g>
  <!-- what each chart measures -->
  <g font-family="system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="200" y="320" style="fill: var(--banner-fg, #1a1a1a)">US FUND</text>
    <text x="200" y="356" style="fill: var(--banner-fg, #1a1a1a)">IN USD</text>
    <text x="600" y="320" style="fill: var(--banner-fg, #1a1a1a)">USD</text>
    <text x="600" y="356" style="fill: var(--banner-fg, #1a1a1a)">IN CZK / EUR</text>
    <text x="1000" y="320" style="fill: var(--banner-accent, #0b6bcb)">IN YOUR</text>
    <text x="1000" y="356" style="fill: var(--banner-accent, #0b6bcb)">OWN MONEY</text>
  </g>
</svg>
