<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A daily candle chart with a moving average and three numbered reading steps">
  <rect width="1200" height="400" style="fill: var(--banner-bg, #f2f4f7)"/>
  <!-- wicks -->
  <g stroke-width="3" style="stroke: var(--banner-fg, #1a1a1a); stroke-opacity: .6">
    <line x1="80" y1="250" x2="80" y2="340"/><line x1="150" y1="230" x2="150" y2="320"/><line x1="220" y1="250" x2="220" y2="330"/>
    <line x1="290" y1="200" x2="290" y2="290"/><line x1="360" y1="180" x2="360" y2="270"/><line x1="430" y1="195" x2="430" y2="280"/>
    <line x1="500" y1="150" x2="500" y2="240"/><line x1="570" y1="130" x2="570" y2="220"/><line x1="640" y1="150" x2="640" y2="235"/>
    <line x1="710" y1="110" x2="710" y2="195"/><line x1="780" y1="90" x2="780" y2="180"/><line x1="850" y1="100" x2="850" y2="190"/>
    <line x1="920" y1="70" x2="920" y2="160"/>
  </g>
  <!-- bodies -->
  <g style="fill: var(--banner-up, #1a9b5b)">
    <rect x="66" y="265" width="28" height="55"/><rect x="276" y="215" width="28" height="60"/><rect x="346" y="195" width="28" height="55"/>
    <rect x="486" y="165" width="28" height="60"/><rect x="556" y="145" width="28" height="55"/><rect x="696" y="125" width="28" height="55"/>
    <rect x="766" y="105" width="28" height="55"/><rect x="906" y="85" width="28" height="55"/>
  </g>
  <g style="fill: var(--banner-down, #d0453a)">
    <rect x="136" y="245" width="28" height="55"/><rect x="206" y="265" width="28" height="45"/><rect x="416" y="210" width="28" height="50"/>
    <rect x="626" y="165" width="28" height="50"/><rect x="836" y="115" width="28" height="55"/>
  </g>
  <!-- moving average -->
  <path d="M60 310 C240 290 380 250 520 215 C660 180 800 150 940 125" fill="none" stroke-width="6"
        style="stroke: var(--banner-accent, #0b6bcb)"/>
  <!-- numbered steps -->
  <g font-family="system-ui, sans-serif" font-size="30" font-weight="800">
    <rect x="1010" y="50" width="56" height="56" style="fill: var(--banner-fg, #1a1a1a)"/>
    <rect x="1010" y="160" width="56" height="56" style="fill: var(--banner-fg, #1a1a1a)"/>
    <rect x="1010" y="270" width="56" height="56" style="fill: var(--banner-fg, #1a1a1a)"/>
    <text x="1038" y="89" text-anchor="middle" style="fill: var(--banner-bg, #f2f4f7)">1</text>
    <text x="1038" y="199" text-anchor="middle" style="fill: var(--banner-bg, #f2f4f7)">2</text>
    <text x="1038" y="309" text-anchor="middle" style="fill: var(--banner-bg, #f2f4f7)">3</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="2" style="fill: var(--banner-fg, #1a1a1a)">
    <text x="1078" y="86">PERIOD</text><text x="1078" y="196">CANDLE</text><text x="1078" y="306">TREND</text>
  </g>
</svg>
