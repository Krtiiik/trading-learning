[project]
name = "trading-learning"
version = "0.1.0"
description = "A beginner knowledge base about trading, built as a static site"
authors = [
    { name = "Lukáš Nedbálek", email = "lukas.nedbalek@email.cz" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.11.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
