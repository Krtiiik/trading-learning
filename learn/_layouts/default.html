<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
{%- assign key = page.url | remove_first: "/" | remove: ".html" | replace: "/", "-" %}
<div class="site" data-kind="{{ layout.kind | default: page.kind | default: 'page' }}" data-key="{{ key }}" data-title="{{ page.title | strip_html | escape }}" data-short="{{ page.short | default: page.title | strip_html | escape }}">
<div class="page-wrap">
{% include nav.html %}
{{ content }}
</div>
<div class="scrim" data-scrim></div>
</div>
{% include brief.html %}
</body>
</html>
