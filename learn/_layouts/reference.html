---
layout: default
kind: reference
---
<div class="layout layout-course no-toc">
{% include sidebar.html %}
<main class="content wide">
<article class="prose">
<header class="page-head">
  <p class="kicker"><span class="num">Reference</span></p>
  <h1>{{ page.title | markdownify | remove: "<p>" | remove: "</p>" | strip }}</h1>
  {%- if page.subtitle %}
  <p class="subtitle">{{ page.subtitle | markdownify | remove: "<p>" | remove: "</p>" | strip }}</p>
  {%- endif %}
</header>
{{ content }}
</article>
</main>
</div>
